<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="narmusicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0D9488" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle for maskable & icon -->
  <rect width="512" height="512" rx="128" fill="#0B1F1E" />
  
  <!-- Subtle circular radiant aura -->
  <circle cx="256" cy="256" r="180" fill="url(#narmusicGrad)" opacity="0.12" />

  <!-- Logo emblem circle -->
  <circle cx="256" cy="256" r="150" fill="url(#narmusicGrad)" filter="url(#shadow)" />

  <!-- Musical Sound Waves & Note Design -->
  <g fill="white" transform="translate(0, 0)">
    <!-- Equalizer Sound Wave Bars Left -->
    <rect x="156" y="230" width="16" height="52" rx="8" fill="url(#glowGrad)" />
    <rect x="186" y="195" width="16" height="122" rx="8" fill="#ffffff" />
    <rect x="216" y="165" width="16" height="182" rx="8" fill="#ffffff" />

    <!-- Musical Note Body & Stem -->
    <!-- Note Stem -->
    <rect x="276" y="150" width="20" height="165" rx="8" fill="#ffffff" />
    <!-- Note Flag / Soundwave Connector -->
    <path d="M280 150 C 330 140, 360 175, 370 215 C 345 195, 315 190, 280 195 Z" fill="#6EE7B7" />
    
    <!-- Note Head Circle -->
    <ellipse cx="250" cy="315" rx="36" ry="26" transform="rotate(-24 250 315)" fill="#ffffff" />

    <!-- Equalizer Sound Wave Bars Right -->
    <rect x="326" y="210" width="16" height="92" rx="8" fill="#ffffff" />
    <rect x="356" y="240" width="16" height="42" rx="8" fill="url(#glowGrad)" />
  </g>
</svg>
